        }
        .liquid-border {
            position: relative;
        }
        .liquid-border::after {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%, rgba(197,160,89,0.2) 100%);
            z-index: -1;
            border-radius: inherit;

            transition: all 0.5s ease;
        }
        .input-ghost:focus {
            border-bottom-color: #b4c8e3;
            background: rgba(255, 255, 255, 0.03);
            outline: none;
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 4s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }

<script>
        function toggleAuth(view) {
            const loginView = document.getElementById('login-view');
            const registerView = document.getElementById('register-view');
            const bgContainer = document.querySelector('.bg-cover');

            if (view === 'register') {
                loginView.classList.add('opacity-0', 'scale-95', 'translate-y-4');
                setTimeout(() => {
                    loginView.classList.add('hidden');
                    registerView.classList.remove('hidden');
                    setTimeout(() => {
                        registerView.classList.remove('opacity-0', 'scale-95', 'translate-y-4');
                    }, 50);
